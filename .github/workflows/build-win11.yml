name: Build Red Alert for Windows 11

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-win11.yml'

permissions:
  contents: read

jobs:
  build-win11:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout maintained Red Alert engine port
        uses: actions/checkout@v4
        with:
          repository: TheAssemblyArmada/Vanilla-Conquer
          ref: ce83b59edd99cccac6cebaae054ca04962c744b7
          path: vanilla-conquer
          submodules: 'true'
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install official prebuilt dependencies
        shell: pwsh
        working-directory: vanilla-conquer
        run: |
          Invoke-WebRequest -Uri https://www.libsdl.org/release/SDL2-devel-2.0.12-VC.zip -OutFile SDL2-devel.zip
          Invoke-WebRequest -Uri https://github.com/ninja-build/ninja/releases/download/v1.10.1/ninja-win.zip -OutFile $Env:TEMP\ninja-win.zip
          Invoke-WebRequest -SkipCertificateCheck -Uri https://openal-soft.org/openal-binaries/openal-soft-1.21.0-bin.zip -OutFile openal-soft-1.21.0-bin.zip
          Expand-Archive SDL2-devel.zip -DestinationPath .
          Expand-Archive $Env:TEMP\ninja-win.zip -DestinationPath $Env:TEMP\ninja
          Expand-Archive openal-soft-1.21.0-bin.zip -DestinationPath .
          echo "$Env:TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ninja --version
          $magickPath = Split-Path -Path (Get-Command magick).Path -Parent
          echo "MAGICK_PATH=$magickPath" >> $env:GITHUB_ENV

      - name: Build Red Alert x64
        shell: pwsh
        working-directory: vanilla-conquer
        env:
          CMAKE_FIND_ROOT_PATH: "SDL2-2.0.12;openal-soft-1.21.0-bin;${{ env.MAGICK_PATH }}"
          VC_CXX_FLAGS: "/Zc:strictStrings;-wd4244;-wd4018;-wd4291;-wd4101;-wd4267;-wd4200"
        run: |
          New-Item -Path "build/release/RelWithDebInfo" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "SDL2-2.0.12\lib\x64\SDL2.dll" -Destination build/release/RelWithDebInfo
          cmake --workflow --preset release

      - name: Collect portable Windows 11 build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "vanilla-conquer\build\release\RelWithDebInfo\vanillara.exe"
          if (-not (Test-Path $exe)) { throw 'vanillara.exe was not produced' }
          Copy-Item $exe dist\vanillara.exe
          Copy-Item $exe dist\RedAlert-Win11.exe
          Copy-Item "vanilla-conquer\SDL2-2.0.12\lib\x64\SDL2.dll" dist\SDL2.dll
          Copy-Item "vanilla-conquer\openal-soft-1.21.0-bin\bin\Win64\soft_oal.dll" dist\OpenAL32.dll
          @'
          Red Alert - Windows 11 x64 build
          =================================
          Modern Windows build of the Red Alert engine using the maintained Vanilla Conquer port.
          No copyrighted game data is included. Put the EXE and both DLLs in a compatible legacy Red Alert data directory.
          '@ | Set-Content -Encoding UTF8 dist\README-WIN11.txt
          Compress-Archive -Path dist\* -DestinationPath RedAlert-Win11-x64.zip -Force

      - name: Upload Windows 11 executable
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert-Win11-x64
          path: |
            dist/*
            RedAlert-Win11-x64.zip
          if-no-files-found: error
