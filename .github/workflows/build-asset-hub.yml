name: Build RA Asset Hub

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TOOLS/AssetHub/**'
      - 'FRAMEWORK/**'
      - 'CMakeLists.txt'
      - 'build_asset_hub.cmd'
      - '.github/workflows/build-asset-hub.yml'

jobs:
  build-asset-hub:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_asset_hub -G "Visual Studio 17 2022" -A x64 -DRA_BUILD_SANDBOX=OFF -DRA_BUILD_ASSET_HUB=ON

      - name: Build
        run: cmake --build build_asset_hub --config Release --target ra_asset_hub --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build_asset_hub/bin/Release/RA-AssetHub.exe" "dist/RA-AssetHub.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RA-AssetHub-Windows-x64
          path: dist/RA-AssetHub.exe
          if-no-files-found: error
