name: Build this fork on Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'build.cmd'
      - 'CODE/**'
      - 'WIN32LIB/**'
      - 'IPX/**'
      - 'VQ/**'
      - 'WINVQ/**'
      - '.github/workflows/build-self.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
