name: Build Red Alert Framework on Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'build.cmd'
      - 'FRAMEWORK/**'
      - 'examples/**'
      - 'assets/click-command/**'
      - '.github/workflows/build-self.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build framework and sandbox
        run: cmake --build build --config Release --target ra_sandbox --parallel

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert-Framework-Windows-x64
          path: |
            build/bin/Release/ra_sandbox.exe
            build/bin/Release/assets/**
            build/lib/Release/ra_engine.lib
            FRAMEWORK/include/**
